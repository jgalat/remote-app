packages:
  - packages/*

allowBuilds:
  '@shopify/react-native-skia': true
  esbuild: true
  msgpackr-extract: true
  unrs-resolver: true

ignoredBuiltDependencies:
  - dtrace-provider

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.30'
  - '@expo/fingerprint@0.20.14'
  - '@expo/inline-modules@0.1.8'
  - '@expo/local-build-cache-provider@57.0.9'
  - '@expo/metro-runtime@57.0.17'
  - '@expo/prebuild-config@57.0.19'
  - '@expo/ui@57.0.24'
  - babel-preset-expo@57.0.15
  - expo-asset@57.0.20
  - expo-constants@57.0.22
  - expo-crypto@57.0.4
  - expo-dev-client@57.0.20
  - expo-dev-launcher@57.0.21
  - expo-dev-menu@57.0.20
  - expo-linking@57.0.13
  - expo-modules-autolinking@57.0.16
  - expo-modules-core@57.0.23
  - expo-modules-jsi@57.1.2
  - expo-notifications@57.0.23
  - expo-router@57.0.27
  - expo-splash-screen@57.0.10
  - expo@57.0.29

nodeLinker: hoisted

# Pin every dependency shared with the root app to the root's version, so packages/*
# (including the pinned pro submodule) never drift. "$name" means "use whatever version
# the root package.json declares", so this auto-tracks future upgrades.
overrides:
  "@hookform/resolvers": "$@hookform/resolvers"
  "@tanstack/react-query": "$@tanstack/react-query"
  "@types/react": "$@types/react"
  expo-file-system: "$expo-file-system"
  expo-router: "$expo-router"
  react: "$react"
  react-hook-form: "$react-hook-form"
  react-native: "$react-native"
  react-native-purchases: "$react-native-purchases"
  react-native-worklets: "$react-native-worklets"
  tsdown: "$tsdown"
  typescript: "$typescript"
  vitest: "$vitest"
  zod: "$zod"

patchedDependencies:
  react-native-actions-sheet@10.1.2: patches/react-native-actions-sheet@10.1.2.patch
