packages:
  - packages/*

allowBuilds:
  '@shopify/react-native-skia': true
  esbuild: true
  msgpackr-extract: true
  unrs-resolver: true

ignoredBuiltDependencies:
  - dtrace-provider

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.21 || 57.0.22 || 57.0.23'
  - '@expo/env@2.4.3'
  - '@expo/fingerprint@0.20.12'
  - '@expo/metro-config@57.0.12'
  - '@expo/metro-file-map@57.0.3'
  - '@expo/router-server@57.0.9'
  - 'babel-preset-expo@57.0.10 || 57.0.11'
  - expo-asset@57.0.16
  - expo-constants@57.0.17
  - expo-font@57.0.3
  - 'expo-modules-core@57.0.15 || 57.0.16 || 57.0.17'
  - 'expo-modules-jsi@57.0.7 || 57.0.8 || 57.1.0'
  - 'expo@57.0.19 || 57.0.20 || 57.0.21'
  - '@expo/metro-runtime@57.0.15'
  - '@expo/ui@57.0.15 || 57.0.16 || 57.0.17'
  - expo-glass-effect@57.0.2
  - 'expo-background-task@57.0.15 || 57.0.16'
  - 'expo-build-properties@57.0.16 || 57.0.17'
  - expo-dev-client@57.0.18
  - expo-dev-launcher@57.0.19
  - expo-dev-menu@57.0.18
  - expo-linking@57.0.9
  - 'expo-notifications@57.0.16 || 57.0.17'
  - 'expo-router@57.0.18 || 57.0.19 || 57.0.20'
  - 'expo-task-manager@57.0.15 || 57.0.16'

nodeLinker: hoisted

# Pin every dependency shared with the root app to the root's version, so packages/*
# (including the pinned pro submodule) never drift. "$name" means "use whatever version
# the root package.json declares", so this auto-tracks future upgrades.
overrides:
  "@hookform/resolvers": "$@hookform/resolvers"
  "@tanstack/react-query": "$@tanstack/react-query"
  "@types/react": "$@types/react"
  expo-file-system: "$expo-file-system"
  expo-router: "$expo-router"
  react: "$react"
  react-hook-form: "$react-hook-form"
  react-native: "$react-native"
  react-native-purchases: "$react-native-purchases"
  react-native-worklets: "$react-native-worklets"
  tsdown: "$tsdown"
  typescript: "$typescript"
  vitest: "$vitest"
  zod: "$zod"

patchedDependencies:
  react-native-actions-sheet@10.1.2: patches/react-native-actions-sheet@10.1.2.patch
